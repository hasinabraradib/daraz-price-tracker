# PLACEHOLDER VALUES ONLY. This file is committed to version control and
# must never contain real credentials. Real secrets are created directly
# in the cluster, out of band, e.g.:
#
#   kubectl create secret generic price-tracker-secrets \
#     --namespace price-tracker \
#     --from-literal=POSTGRES_PASSWORD='<real password>' \
#     --from-literal=DATABASE_URL='postgresql+asyncpg://daraz:<real password>@postgres:5432/daraz_price_tracker' \
#     --from-literal=DISCORD_WEBHOOK_URL='<real discord webhook url, or empty>' \
#     --from-literal=SMTP_USERNAME='<real smtp username, or empty>' \
#     --from-literal=SMTP_PASSWORD='<real smtp password, or empty>' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# `kubectl apply -f k8s/secret.yaml` also works for a throwaway/dev
# cluster (e.g. this minikube deploy) since the values below are inert
# placeholders, but never edit this file in place to hold a real value —
# use the imperative command above (or a sealed-secrets/external-secrets
# tool in a real environment) so the credential never touches git history.
apiVersion: v1
kind: Secret
metadata:
  name: price-tracker-secrets
  namespace: price-tracker
type: Opaque
stringData:
  POSTGRES_PASSWORD: "changeme"
  # Full connection string (asyncpg driver) — embeds the password above,
  # so it lives here rather than in the ConfigMap. Host "postgres" is the
  # headless Service in postgres-statefulset.yaml.
  DATABASE_URL: "postgresql+asyncpg://daraz:changeme@postgres:5432/daraz_price_tracker"
  DISCORD_WEBHOOK_URL: ""
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
