# Headless Service (clusterIP: None). A StatefulSet's pods each get a
# stable network identity — postgres-0.postgres.price-tracker.svc.cluster.local
# — but that per-pod DNS record only gets created if the governing Service
# has no cluster IP of its own to load-balance behind. A normal ClusterIP
# Service would round-robin between pods instead, which defeats the point
# of a StatefulSet (stable, individually addressable pods) and is wrong
# for a database anyway. With one replica this mostly matters for the
# principle — it's what makes scaling to a primary/replica topology later
# possible without changing how clients connect.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: price-tracker
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: price-tracker
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: price-tracker-config
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: price-tracker-config
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: price-tracker-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              # postgres refuses to initdb into a non-empty mount point
              # that already has a lost+found dir (common on freshly
              # provisioned PVs), so give it a subdirectory instead
              subPath: pgdata
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
