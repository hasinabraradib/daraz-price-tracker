# PLACEHOLDER VALUE ONLY — same rule as k8s/secret.yaml: never edit this
# file in place to hold a real admin password. On a real cluster, create
# it imperatively instead:
#
#   kubectl create secret generic grafana-admin \
#     --namespace monitoring \
#     --from-literal=admin-password='<real password>' \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring
type: Opaque
stringData:
  admin-user: "admin"
  admin-password: "changeme"
