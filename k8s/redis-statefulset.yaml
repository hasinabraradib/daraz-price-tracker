# Headless Service — same reasoning as postgres-statefulset.yaml: a
# StatefulSet needs one to give its pod(s) a stable per-pod DNS identity
# instead of being load-balanced behind a single cluster IP.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: price-tracker
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: price-tracker
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # AOF persistence: the scrape queue (main list, delayed sorted
          # set, dead letter hash) is real application state, not a cache
          # — losing it on a pod restart would silently drop in-flight and
          # delayed retry jobs. Redis's default (RDB snapshots only) can
          # lose the last few minutes of writes; appendonly trades a bit
          # of throughput for durability on every write instead.
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
