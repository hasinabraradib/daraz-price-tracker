services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./api/app:/code/app
      - ./shared:/code/shared
      - ./api/alembic:/code/alembic
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    ports:
      - "9100:9100"  # Prometheus metrics — worker has no other HTTP server
    volumes:
      - ./worker/worker_app:/code/app
      - ./shared:/code/shared
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-daraz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-daraz}
      POSTGRES_DB: ${POSTGRES_DB:-daraz_price_tracker}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-daraz}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"  # SMTP — AlertRule(channel="email") sends here in dev
      - "8025:8025"  # web UI — view "sent" mail at http://localhost:8025

volumes:
  postgres_data:
  redis_data:
