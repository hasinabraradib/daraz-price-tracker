services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./api:/code
    environment:
      DATABASE_URL: ${DATABASE_URL}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-daraz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-daraz}
      POSTGRES_DB: ${POSTGRES_DB:-daraz_price_tracker}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-daraz}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
